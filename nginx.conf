server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 ipv6=off valid=300s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location ^~ /__linkmesh/ {
    set $linkmesh_origin https://ai.linkmesh.org;
    rewrite ^/__linkmesh/(.*)$ /$1 break;
    proxy_pass $linkmesh_origin;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name ai.linkmesh.org;
    proxy_set_header Host ai.linkmesh.org;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    client_max_body_size 128m;
  }

  location ^~ /__deeprouter/ {
    set $deeprouter_origin https://deeprouter.top;
    rewrite ^/__deeprouter/(.*)$ /$1 break;
    proxy_pass $deeprouter_origin;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name deeprouter.top;
    proxy_set_header Host deeprouter.top;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }

  location = /console/client {
    return 301 $scheme://$http_host/;
  }

  location = /client {
    return 301 $scheme://$http_host/;
  }

  location ^~ /client/ {
    return 301 $scheme://$http_host/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js)$ {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }
}
